[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "topic-cluster-planner"
version = "1.0.0"
description = "Turn a keyword list into pillar + spoke pages with an internal link plan"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Meer Hamza", email = "meerhamza5@gmail.com" }]
requires-python = ">=3.10"
dependencies = ["requests>=2.28", "beautifulsoup4>=4.11", "pandas>=1.5", "openpyxl>=3.1", "click>=8.1"]
keywords = ["seo", "topic", "cluster", "planner"]

[project.urls]
Homepage = "https://github.com/marketing-MEER/topic-cluster-planner"
"SEO Toolbox" = "https://github.com/marketing-MEER/seo-toolbox"
LinkedIn = "https://www.linkedin.com/in/meerhamza-seo"

[project.scripts]
topic-cluster-planner = "topic_cluster_planner.cli:main"

[tool.setuptools]
packages = ["topic_cluster_planner"]
